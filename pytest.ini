[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
markers =
    slow: tests that take more than a second or need a built artifact
    integration: touches the filesystem, TinyDB, or config files
    packaging: asserts on the PyInstaller output in dist/
    allow_subprocess: opt out of the global subprocess guard
norecursedirs =
    .git
    build
    dist
    _export
    temp
    output
    projects
    models
    inference
    libs
    Ollama
    Potrace
    SAM2.1
    Paddle-OCR
    cairosvg
    craft_text_detection_models_weight
    genai_bridge
    plc_bridge
    docs
    docs_src
